name: Release

# Publishing a GitHub release builds and checks the package and the desktop extension bundle,
# attaches them to the release, publishes the package to PyPI with trusted publishing (no
# tokens) once a maintainer approves the "pypi" environment, then lists the new version in the
# official MCP Registry. The bundle travels as its own artifact so it never reaches PyPI.

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: The tag matches every version in the repository
        run: |
          python - <<'EOF'
          import json, os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          server = json.load(open("server.json"))
          bundle = json.load(open("mcpb/manifest.json"))
          bundle_project = tomllib.load(open("mcpb/pyproject.toml", "rb"))["project"]
          found = {version, server["version"], *(p["version"] for p in server["packages"])}
          found |= {bundle["version"], bundle_project["version"]}
          if found != {tag}:
              sys.exit(f"tag v{tag} does not match versions {sorted(found)}")
          EOF
      - name: Test
        run: python -m pip install -e '.[dev]' && python -m pytest -q
      - name: Build and check
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Build the desktop extension bundle
        run: |
          mkdir -p bundle
          npx --yes @anthropic-ai/mcpb@2.1.2 validate mcpb/manifest.json
          npx --yes @anthropic-ai/mcpb@2.1.2 pack mcpb "bundle/twin-me-up-${GITHUB_REF_NAME#v}.mcpb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mcpb
          path: bundle/
          if-no-files-found: error

  attach:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mcpb
          path: dist
      - name: Attach the package and desktop extension to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/twin-me-up/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait until the version is live on PyPI
        run: |
          version="${GITHUB_REF_NAME#v}"
          for _ in $(seq 1 30); do
            curl -sf "https://pypi.org/pypi/twin-me-up/$version/json" > /dev/null && exit 0
            sleep 10
          done
          echo "twin-me-up $version did not appear on PyPI" >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -sfL "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
